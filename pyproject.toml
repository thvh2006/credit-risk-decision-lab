[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-decision-lab"
version = "0.1.0"
description = "Time-stable probability-of-default modelling and underwriting policy analysis."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=1.20",
  "pyarrow>=18",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "shap>=0.47",
  "xgboost>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
